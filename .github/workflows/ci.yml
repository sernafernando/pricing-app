name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.1

      - name: Ruff check (lint)
        run: ruff check app/ --output-format=github

      - name: Ruff format check
        run: ruff format app/ --check --diff

  backend-smoke:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres service for `@pytest.mark.postgres` tests only (currently the
    # PPP resolver's LATERAL-join tests — see costo_ppp_service.py's
    # docstring and tests/conftest.py's "PostgreSQL fixtures" section). The
    # rest of the ~3700-test suite keeps running on the in-memory SQLite `db`
    # fixture (env vars below) — moving the full suite to Postgres was
    # rejected as unnecessary disruption for this round; only the resolver's
    # LATERAL path is PostgreSQL-only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests (smoke + integration)
        run: pytest tests/ -v --tb=short
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "ci-test-secret-key-minimum-32-bytes!"
          ERP_BASE_URL: "http://localhost:9999"
          POSTGRES_TEST_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/pricing_test"

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      # Ratchet: passes on the tree as it stands (known offenders are
      # grandfathered in css-guard/allowlist.js) and fails on a NEW hardcoded
      # color. The companion stale-entry check runs in `frontend-test`.
      - name: Stylelint (CSS design-token guard)
        run: pnpm run lint:css

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (verifies a clean install compiles)
        run: pnpm build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (vitest)
        run: pnpm test

  frontend-visual:
    name: Frontend Visual Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Separate job, not a step in `frontend-test`: this one needs a ~170 MB
    # browser download plus apt system libraries, and the 610-test jsdom suite
    # must stay runnable (and fast) without any of that. `pnpm test` is
    # `--project=unit` and `pnpm run test:visual` is `--project=visual`, so the
    # two never pull each other in.
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the exact Playwright version rather than the lockfile hash:
      # the browser build is tied to Playwright's version and nothing else, so
      # this keeps hitting cache across unrelated dependency changes.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium and system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The browser binary is cached, but the apt libraries it links against are
      # installed system-wide and are NOT restored by actions/cache. They have
      # to be reinstalled on every run or Chromium fails to start.
      - name: Install system libraries (browser restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run visual tests (real Chromium)
        run: pnpm run test:visual
