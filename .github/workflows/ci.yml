name: CI

on:
  # No `branches:` filter here, deliberately. Filtering by BASE branch means a
  # stacked PR — one opened against another feature branch instead of `main` —
  # never triggers this workflow at all. That happened: PR #1090 was stacked on
  # #1088 and merged without a single CI run, while its checks page still showed
  # a green third-party scanner, so it looked verified. A PR that skips CI
  # silently is worse than one that fails it.
  #
  # Every pull request runs CI now, whatever it targets. `concurrency` below is
  # keyed on `github.ref` (which is `refs/pull/N/merge` for this event), so each
  # PR still cancels only its own superseded runs.
  pull_request:
  # `push` STAYS filtered. Without the filter every branch push would duplicate
  # the run its pull request already does.
  push:
    branches: [main, master]
  # Manual trigger, so any ref can be re-verified on demand without pushing a
  # commit to do it. Without this there is NO way to make CI run again over an
  # unchanged `main`: `gh run rerun` only revives a run that already exists, and
  # `gh workflow run` requires exactly this event.
  #
  # The gap is not theoretical. During the 2026-08-06 Actions outage the run for
  # `ff2618f0` was cancelled mid-flight, so `main` carried merged work no
  # pipeline had ever checked, and there was no way to ask for another run
  # short of pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.1

      - name: Ruff check (lint)
        run: ruff check app/ --output-format=github

      - name: Ruff format check
        run: ruff format app/ --check --diff

  backend-smoke:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # Postgres service for `@pytest.mark.postgres` tests only (currently the
    # PPP resolver's LATERAL-join tests — see costo_ppp_service.py's
    # docstring and tests/conftest.py's "PostgreSQL fixtures" section). The
    # rest of the ~3700-test suite keeps running on the in-memory SQLite `db`
    # fixture (env vars below) — moving the full suite to Postgres was
    # rejected as unnecessary disruption for this round; only the resolver's
    # LATERAL path is PostgreSQL-only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pricing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests (smoke + integration)
        run: pytest tests/ -v --tb=short
        env:
          ENVIRONMENT: testing
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "ci-test-secret-key-minimum-32-bytes!"
          ERP_BASE_URL: "http://localhost:9999"
          POSTGRES_TEST_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/pricing_test"

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      # Ratchet: passes on the tree as it stands (known offenders are
      # grandfathered in css-guard/allowlist.js) and fails on a NEW hardcoded
      # color. The companion stale-entry check runs in `frontend-test`.
      - name: Stylelint (CSS design-token guard)
        run: pnpm run lint:css

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (verifies a clean install compiles)
        run: pnpm build

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (vitest)
        run: pnpm test

  frontend-visual:
    name: Frontend Visual Tests
    runs-on: ubuntu-latest
    # The visual suite itself runs in ~6s. Everything else here is setup, and
    # the apt step below is the one that has hung for hours (see `env`).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    # Separate job, not a step in `frontend-test`: this one needs a ~170 MB
    # browser download plus apt system libraries, and the 610-test jsdom suite
    # must stay runnable (and fast) without any of that. `pnpm test` is
    # `--project=unit` and `pnpm run test:visual` is `--project=visual`, so the
    # two never pull each other in.
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the exact Playwright version rather than the lockfile hash:
      # the browser build is tied to Playwright's version and nothing else, so
      # this keeps hitting cache across unrelated dependency changes.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # NO `--with-deps`, and no `install-deps` step on the cache-hit path.
      # Both shell out to `apt-get update`, which on these runners regularly
      # stalls: the azure.archive.ubuntu.com mirror the image prefers goes
      # unreachable, apt falls back to archive.ubuntu.com, and then hangs there
      # too. Run 32279003439 sat in that step for nine minutes without emitting
      # a line and hit the job timeout; the visual suite it was blocking runs
      # in six seconds.
      #
      # The ubuntu-24.04 image already ships Chromium's shared libraries (it
      # bundles Chrome and Firefox), so the apt round-trip bought nothing but
      # an unbounded network dependency. If a library ever does go missing,
      # Chromium fails to launch and the test step below says so immediately.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Run visual tests (real Chromium)
        run: pnpm run test:visual
