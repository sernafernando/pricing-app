# Live copy of /etc/nginx/sites-enabled/pricing-app on apps (a regular file there,
# not a symlink; sites-available/pricing-app is stale and lacks the mcp include).
# Not deployed automatically: edit here, then copy to apps, `nginx -t`, reload.
# snippets/pricing-mcp.conf lives only on apps (/etc/nginx/snippets/).

# combined fields first so existing parsers keep working; then request time
# (rt, seconds) and upstream time (urt; "-" when no upstream, comma list on retry).
log_format pricing_timed
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt="$upstream_response_time"';

upstream pricing_api {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 8082;
    listen [::]:8082;
    server_name pricing-app.gaussonline.com.ar;

    access_log /var/log/nginx/pricing-access.log pricing_timed;
    error_log /var/log/nginx/pricing-error.log;

    root /srv/apps/pricing-app/frontend/dist;
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
    index index.html;

    include snippets/pricing-mcp.conf;

    location /api {
        client_max_body_size 15M;
        proxy_pass http://pricing_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /health {
        proxy_pass http://pricing_api/health;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
