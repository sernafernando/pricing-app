# Installed by deploy.sh into /etc/systemd/system/pricing-worker.service.d/ on every deploy that
# restarts the backend. Edit it here, not on the server.
#
# A safety net: the generic worker peaked at 0.33-0.35G (journal 22/11, cgroup memory.peak 24/11).
# The limits leave about 3x that for a heavier drain. See docs/RUNBOOKS.md "Service Memory Limits".
[Service]
Environment=MALLOC_ARENA_MAX=2
Restart=always
MemoryHigh=1G
MemoryMax=1.25G
