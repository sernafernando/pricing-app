# Installed by deploy.sh into /etc/systemd/system/pricing-worker-ml.service.d/ on every deploy that
# restarts the backend (only if the unit is installed). Edit it here, not on the server.
#
# A safety net: worker-ml's working set plateaus at 2.4-2.7G in every run (journal 18/11-22/11 and
# cgroup memory.peak on 24/11), so both limits sit above that. See docs/RUNBOOKS.md "Service Memory Limits".
[Service]
Environment=MALLOC_ARENA_MAX=2
Restart=always
# Above it the kernel throttles the process (no swap, so it stays slow until it frees memory).
MemoryHigh=3.5G
# A single process: an OOM kill ends it and Restart=always starts it again (the queue claims it held
# go back when their lease expires).
MemoryMax=4G
