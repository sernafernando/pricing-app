# Installed by deploy.sh into /etc/systemd/system/pricing-api.service.d/ on every deploy that
# restarts the backend. Edit it here, not on the server: the next deploy puts this copy back.
#
# A safety net, not the fix: the fix is finding which requests make the uvicorn workers keep their
# memory. A limit that kills the API under normal load is worse than none, so both limits sit above
# the highest real peak: 6.5G after 76 h of uptime (journal, 22/11), 4.2-4.3G after 7-43 h. See
# docs/RUNBOOKS.md "Service Memory Limits".
[Service]
# glibc gives allocating threads their own heap arena (up to 8 per CPU). FastAPI runs sync endpoints
# in a 40-thread pool, so every worker ends up holding many half-empty arenas after heavy requests.
Environment=MALLOC_ARENA_MAX=2
Restart=always
# Above it the kernel throttles the service (there is no swap to reclaim into): slow, never killed.
MemoryHigh=7G
# Above it the kernel OOM-kills the largest process of the service: one uvicorn worker.
MemoryMax=8G
# Keep the service running when that happens: uvicorn's supervisor starts a new worker, and the
# other three keep answering. The default (stop) would restart all four.
OOMPolicy=continue
