[pytest]
markers =
    postgres: requires a real PostgreSQL instance (set POSTGRES_TEST_URL, or rely on CI's `postgres` service). Skipped locally with a clear message when PostgreSQL is unreachable.
    volume: seeds a production-sized dataset (tens of thousands of rows) to pin statement counts, plans or timings. Runs in CI's own "Backend Tests (Postgres volume)" job, with a database, whether or not it is also marked `postgres`; the other backend jobs deselect it.
